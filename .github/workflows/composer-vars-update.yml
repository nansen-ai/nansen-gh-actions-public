---
name: Composer Variables Update

on:
    workflow_call:
        secrets:
            WORKLOAD_ID_PROVIDER:
                required: true
            SERVICE_ACCOUNT:
                required: true
        inputs:
            GCP_PROJECT:
                required: true
                type: string
            COMPOSER_ENVIRONMENT_NAME:
                required: true
                type: string
            COMPOSER_ENVIRONMENT_LOCATION:
                required: true
                type: string
            VARIABLES_FILE_PATH:
                required: true
                type: string
            VARIABLES_FILE_NAME:
                required: true
                type: string


jobs:
    composer-vars-update:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v3
            - name: Authenticate to Google Cloud
              id: gcloud_auth
              uses: google-github-actions/auth@v1
              with:
                  workload_identity_provider: ${{ secrets.WORKLOAD_ID_PROVIDER }}
                  service_account: ${{ secrets.SERVICE_ACCOUNT }}
                  project_id: ${{ inputs.GCP_PROJECT }}
                  token_format: 'access_token'
            - name: Set up Cloud SDK
              id: setup_cloud_sdk
              uses: google-github-actions/setup-gcloud@v1
              with:
                version: '413.0.0'
                install_components: gke-gcloud-auth-plugin
            - name: Composer Storage Data Import
              id: composer_storage_data_import
              env:
                COMPOSER_ENVIRONMENT_NAME: ${{ inputs.COMPOSER_ENVIRONMENT_NAME }}
                COMPOSER_ENVIRONMENT_LOCATION: ${{ inputs.COMPOSER_ENVIRONMENT_LOCATION }}
                VARIABLES_FILE_PATH: ${{ inputs.VARIABLES_FILE_PATH }}
                GCP_PROJECT: ${{ inputs.GCP_PROJECT }}
              run: |
                gcloud composer environments storage data import \
                --environment=$COMPOSER_ENVIRONMENT_NAME \
                --location=$COMPOSER_ENVIRONMENT_LOCATION \
                --source=$VARIABLES_FILE_PATH \
                --project=$GCP_PROJECT
            - name: Composer Variables Import
              id: composer_variables_import
              env:
                USE_GKE_GCLOUD_AUTH_PLUGIN: True
                COMPOSER_ENVIRONMENT_NAME: ${{ inputs.COMPOSER_ENVIRONMENT_NAME }}
                COMPOSER_ENVIRONMENT_LOCATION: ${{ inputs.COMPOSER_ENVIRONMENT_LOCATION }}
                GCP_PROJECT: ${{ inputs.GCP_PROJECT }}
                VARIABLES_FILE_NAME: ${{ inputs.VARIABLES_FILE_NAME }}
              run: |
                gcloud composer environments run \
                $COMPOSER_ENVIRONMENT_NAME \
                --location=$COMPOSER_ENVIRONMENT_LOCATION \
                --project=$GCP_PROJECT \
                variables \
                import -- /home/airflow/gcs/data/$VARIABLES_FILE_NAME
